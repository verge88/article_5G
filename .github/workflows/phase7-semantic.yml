name: phase7-healthy-SMF-procedure-semantics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase7-semantic.yml"
      - "src/phase7_healthy_smf.py"
      - "tests/test_phase7_healthy_smf.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-healthy-smf-dnn-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NF lab, parsing and test packages
        run: |
          python -m pip install -r requirements.txt pycryptodome
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcpdump tshark
      - name: Verify controlled mutation and temporal parser tests
        run: |
          python -m py_compile src/phase7_healthy_smf.py src/phase6_correlate.py
          python -m pytest -q tests/test_phase7_healthy_smf.py tests/test_phase6_correlate.py
      - name: Checkout pinned Open5GS laboratory deployment
        run: |
          git clone --filter=blob:none https://github.com/herlesupreeth/docker_open5gs.git upstream_open5gs
          git -C upstream_open5gs checkout 1f3bcf73f926b5b7526ef3c41cd2b839c2b17ac3
          mkdir -p results/phase7
          git rev-parse HEAD > results/phase7/research_sha.txt
          git -C upstream_open5gs rev-parse HEAD > results/phase7/upstream_sha.txt
      - name: Pull actual 5GC and UERANSIM images
        run: |
          docker pull ghcr.io/herlesupreeth/docker_open5gs:master
          docker tag ghcr.io/herlesupreeth/docker_open5gs:master docker_open5gs
          docker pull ghcr.io/herlesupreeth/docker_ueransim:master
          docker tag ghcr.io/herlesupreeth/docker_ueransim:master docker_ueransim
          docker image inspect ghcr.io/herlesupreeth/docker_open5gs:master \
            --format '{{json .RepoDigests}}' > results/phase7/open5gs_image_digest.txt
          docker image inspect ghcr.io/herlesupreeth/docker_ueransim:master \
            --format '{{json .RepoDigests}}' > results/phase7/ueransim_image_digest.txt
      - name: Start isolated 5GC gNB with registered authorized UE
        run: bash scripts/prepare_5gc.sh
      - name: Record transient SBI signaling in private runner only
        run: |
          sudo tcpdump -i any -s 0 -w "$RUNNER_TEMP/phase7_sbi.pcap" 'tcp port 7777' >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/phase7_pcap_pid"
          sleep 2
      - name: Real PDU trials with SMF healthy and unsupported requested DNN
        env:
          ALLOW_LAB_UE_DNN_CHANGE: "yes"
        run: |
          python -m src.phase7_healthy_smf --compose-dir upstream_open5gs \
            --out-dir results/phase7 --repeats 6
      - name: Stop transient network capture before decoding
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/phase7_pcap_pid" ]; then
            sudo kill -SIGINT "$(cat "$RUNNER_TEMP/phase7_pcap_pid")" || true
            sleep 3
          fi
      - name: Correlate genuine Nsmf HTTP2 requests with UE windows
        if: success()
        run: |
          python -m src.phase6_correlate --pcap "$RUNNER_TEMP/phase7_sbi.pcap" \
            --trials results/phase7/real_pdu_windows.csv \
            --out results/phase7
      - name: Save reproducible source and environment
        if: always()
        run: |
          mkdir -p results/phase7
          python -m pip freeze > results/phase7/environment.txt
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/phase7/finished_utc.txt
      - name: Publish de-identified trial and HTTP2 metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-real-healthy-smf-semantic-fault
          path: results/phase7/
          if-no-files-found: warn
          retention-days: 90
      - name: Tear down lab, erase raw pcap, restore UE config
        if: always()
        run: |
          docker rm -f nr_ue nr_gnb || true
          if [ -d upstream_open5gs ]; then
            cd upstream_open5gs
            docker compose -f sa-deploy.yaml down -v || true
          fi
          sudo rm -f "$RUNNER_TEMP/phase7_sbi.pcap"
