name: phase19-dual-UE-NGAP-PFCP-PDML-IE-ancestry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase19-dual-ue-pdml.yml"
      - "scripts/phase19_prepare_dual_ue.sh"
      - "src/phase19_pdml.py"
      - "src/phase19_live.py"
      - "src/phase19_audit.py"
      - "tests/test_phase19_pdml_dual_ue.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  three-real-open5gs-5gc:
    name: Live genuine two-UE N2/N4 PDML IE runner ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replica: ["11","22","33"]
    steps:
      - name: Checkout immutable research revision
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific and signing dependencies
        run: python -m pip install -r requirements.txt pycryptodome
      - name: Run PFCP association-limits, crypto and lab safety tests
        run: |
          python -m py_compile src/phase19_live.py src/phase19_pdml.py src/phase19_audit.py
          python -m pytest -q tests/test_phase19_pdml_dual_ue.py tests/test_phase14_n4.py tests/test_phase9_receipts.py
      - name: Install real tshark and sandbox namespace firewall prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcpdump tshark iptables
          command -v nsenter
          command -v tshark
          sudo -n true
      - name: Retrieve pinned Open5GS 5GC and preserve exact versions
        run: |
          git clone --filter=blob:none https://github.com/herlesupreeth/docker_open5gs.git upstream_open5gs
          git -C upstream_open5gs checkout 1f3bcf73f926b5b7526ef3c41cd2b839c2b17ac3
          mkdir -p results/phase19
          git rev-parse HEAD > results/phase19/research_commit.txt
          git -C upstream_open5gs rev-parse HEAD > results/phase19/upstream_commit.txt
          printf '${{ matrix.replica }}\n' > results/phase19/replica.txt
      - name: Resolve real Open5GS and UERANSIM container image digests
        run: |
          docker pull ghcr.io/herlesupreeth/docker_open5gs:master
          docker tag ghcr.io/herlesupreeth/docker_open5gs:master docker_open5gs
          docker pull ghcr.io/herlesupreeth/docker_ueransim:master
          docker tag ghcr.io/herlesupreeth/docker_ueransim:master docker_ueransim
          docker image inspect ghcr.io/herlesupreeth/docker_open5gs:master \
            --format '{{json .RepoDigests}}' > results/phase19/open5gs_image_digest.txt
          docker image inspect ghcr.io/herlesupreeth/docker_ueransim:master \
            --format '{{json .RepoDigests}}' > results/phase19/ueransim_image_digest.txt
      - name: Provision isolated real Open5GS NRF AMF SMF UPF and UERANSIM
        run: bash scripts/prepare_5gc.sh
      - name: Provision second independent subscriber and UE container
        env:
          ALLOW_PHASE19_DISPOSABLE_LAB: "yes"
        run: bash scripts/phase19_prepare_dual_ue.sh
      - name: Run 9 actual overlapping two-UE capture windows and real N4 failure
        env:
          ALLOW_PHASE19_DISPOSABLE_LAB: "yes"
        run: |
          python -m src.phase19_live \
            --replica "${{ matrix.replica }}" \
            --compose-dir upstream_open5gs \
            --out results/phase19
      - name: Record UTC time and exact research environment
        if: always()
        run: |
          mkdir -p results/phase19
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/phase19/utc_finished.txt
          python -m pip freeze > results/phase19/pip_environment.txt
      - name: Publish sanitized per-trial NGAP Nsmf PFCP and signed KIE only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-real-${{ matrix.replica }}
          path: results/phase19/
          retention-days: 90
          if-no-files-found: warn
      - name: Erase ephemeral NF lab and network
        if: always()
        run: |
          docker rm -f nr_ue nr_ue2 nr_gnb || true
          if [ -d upstream_open5gs ]; then
            cd upstream_open5gs
            docker compose -f sa-deploy.yaml down -v || true
          fi

  cross-runner-independent-crypto-and-PFCP-audit:
    name: Independent signed per-UE two concurrent UE and NGAP PFCP PDML IE ancestry evidence audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [three-real-open5gs-5gc]
    steps:
      - name: Checkout independent source verifier
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verifier requirements
        run: python -m pip install -r requirements.txt
      - name: Test no raw identifiers and strict signature protections
        run: python -m pytest -q tests/test_phase19_pdml_dual_ue.py tests/test_phase9_receipts.py
      - name: Fetch all three real runner outputs on different GitHub machine
        uses: actions/download-artifact@v4
        with:
          pattern: phase19-real-*
          path: phase19_inputs/
          merge-multiple: false
      - name: Re-verify every genuine KIE and recompute UE/PFCP ratios
        run: |
          python -m src.phase19_audit --root phase19_inputs --out results/phase19-independent
          git rev-parse HEAD > results/phase19-independent/audit_source_commit.txt
          python -m pip freeze > results/phase19-independent/environment.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase19-independent/verified_dual_UE_PDML_results.json")
          x=json.loads(p.read_text())
          assert x["real_window_count"]==27
          assert x["real_separately_started_and_provisioned_UE_PDU_attempts"]==54
          assert x["ed25519_signed_original_KIE_verified"]==27
          assert x["replay_rejections"]==27
          assert x["proven_cross_protocol_UE_session_identity_joins"]==0
          assert x["by_phase"]["normal"]["real_PDU_success_total"]==18
          assert x["by_phase"]["n4_full_drop"]["real_PDU_success_total"]==0
          assert x["by_phase"]["recovery"]["real_PDU_success_total"]==18
          for phase in ("normal","n4_full_drop","recovery"):
              q=x["by_phase"][phase]
              assert q["endpoint_role_UL_candidates"] <= q["numeric_UL_candidates"]
              assert q["endpoint_role_DL_candidates"] <= q["numeric_DL_candidates"]
          print("54 genuine concurrent UE PDU attempts, 27 signed PDML evidence and strict attribution abstention audited")
          PY
      - name: Publish independent verified aggregate and code provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-independent-verified-dual-UE-PDML
          path: results/phase19-independent/
          retention-days: 90
          if-no-files-found: warn
