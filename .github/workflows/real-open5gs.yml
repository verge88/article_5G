name: real-open5gs-sbi

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-open5gs.yml"
      - "src/real_sbi.py"
      - "tests/test_real_sbi.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-nrf-http2:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the probe parser
        run: python -m pytest -q tests/test_real_sbi.py
      - name: Obtain pinned Open5GS deployment configuration
        run: |
          git clone --filter=blob:none https://github.com/herlesupreeth/docker_open5gs.git upstream_open5gs
          git -C upstream_open5gs checkout 1f3bcf73f926b5b7526ef3c41cd2b839c2b17ac3
          git -C upstream_open5gs rev-parse HEAD > upstream_commit.txt
      - name: Pull Open5GS container and start genuine NF services
        run: |
          docker pull ghcr.io/herlesupreeth/docker_open5gs:master
          docker tag ghcr.io/herlesupreeth/docker_open5gs:master docker_open5gs:latest
          cd upstream_open5gs
          docker compose -f sa-deploy.yaml up -d nrf scp ausf udm
          docker compose -f sa-deploy.yaml ps
      - name: Collect live HTTP/2 NRF discovery KIE observations
        run: |
          python -m src.real_sbi --endpoint http://172.22.0.12:7777 --target AUSF --cycles 40 --ready-seconds 150 --out results/real_sbi_probes.csv
      - name: Capture evidence and reproducibility metadata
        if: always()
        run: |
          mkdir -p results
          date -u +'%Y-%m-%dT%H:%M:%SZ' > results/collected_at_utc.txt
          git rev-parse HEAD > results/research_commit.txt
          cp upstream_commit.txt results/upstream_open5gs_commit.txt || true
          docker image inspect ghcr.io/herlesupreeth/docker_open5gs:master --format '{{json .RepoDigests}}' > results/open5gs_image_digests.txt || true
          docker inspect -f '{{.State.Running}}' nrf > results/nrf_running.txt || true
          docker inspect -f '{{.State.Running}}' ausf > results/ausf_running.txt || true
          if [ -d upstream_open5gs ]; then
            (cd upstream_open5gs && docker compose -f sa-deploy.yaml ps) > results/docker_compose_ps.txt || true
          fi
      - name: Publish evidence whether successful or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-open5gs-sbi-evidence
          path: results/
          if-no-files-found: warn
          retention-days: 90
      - name: Tear down isolated NF lab
        if: always()
        run: |
          if [ -d upstream_open5gs ]; then
            cd upstream_open5gs && docker compose -f sa-deploy.yaml down -v || true
          fi
