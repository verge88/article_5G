name: research-experiments

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-hierarchical-kie:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests and data-leakage guards
        run: python -m pytest -q
      - name: Reproduce original ablations and shifted-distribution tests
        run: python -m src.experiment --out-dir results
      - name: Evaluate sensitivity to compromised witnesses and false testimony
        run: python -m src.robustness --out-dir results
      - name: Record environment and exact commit
        if: always()
        run: |
          mkdir -p results
          python -m pip freeze > results/environment.txt
          git rev-parse HEAD > results/source_commit.txt
      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5g-kie-robustness-experiment
          path: results/
          if-no-files-found: warn
          retention-days: 90
