name: phase6-real-PDU-SBI-temporal-correlation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase6-correlation.yml"
      - "src/phase6_lab.py"
      - "src/phase6_correlate.py"
      - "tests/test_phase6_correlate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlate-real-nsmf-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Open5GS experiment and HTTP2 trace tools
        run: |
          python -m pip install -r requirements.txt pycryptodome
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcpdump tshark
      - name: Verify decoder and correspondence controls
        run: |
          python -m py_compile src/phase6_lab.py src/phase6_correlate.py
          python -m pytest -q tests/test_phase6_correlate.py
      - name: Checkout pinned Open5GS deployment configuration
        run: |
          git clone --filter=blob:none https://github.com/herlesupreeth/docker_open5gs.git upstream_open5gs
          git -C upstream_open5gs checkout 1f3bcf73f926b5b7526ef3c41cd2b839c2b17ac3
          mkdir -p results/phase6
          git -C upstream_open5gs rev-parse HEAD > results/phase6/upstream_sha.txt
          git rev-parse HEAD > results/phase6/research_sha.txt
      - name: Pull real Open5GS 5G Core and UERANSIM binaries
        run: |
          docker pull ghcr.io/herlesupreeth/docker_open5gs:master
          docker tag ghcr.io/herlesupreeth/docker_open5gs:master docker_open5gs
          docker pull ghcr.io/herlesupreeth/docker_ueransim:master
          docker tag ghcr.io/herlesupreeth/docker_ueransim:master docker_ueransim
          docker image inspect ghcr.io/herlesupreeth/docker_open5gs:master \
            --format '{{json .RepoDigests}}' > results/phase6/open5gs_image_digest.txt
          docker image inspect ghcr.io/herlesupreeth/docker_ueransim:master \
            --format '{{json .RepoDigests}}' > results/phase6/ueransim_image_digest.txt
      - name: Start isolated 5GC and provision matching UERANSIM lab subscriber
        run: bash scripts/prepare_5gc.sh
      - name: Start protected temporary capture of real SBI requests
        run: |
          sudo tcpdump -i any -s 0 -w "$RUNNER_TEMP/phase6.pcap" 'tcp port 7777' >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/phase6_pid"
          sleep 2
      - name: Measure real UE trial intervals under normal SMF stop and recovery
        env:
          ALLOW_LAB_ONLY_SMF_FAILURE: "yes"
        run: |
          python -m src.phase6_lab --compose-dir upstream_open5gs --out results/phase6 --repeats 6
      - name: Close SBI capture to finalize packet headers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/phase6_pid" ]; then
            sudo kill -SIGINT "$(cat "$RUNNER_TEMP/phase6_pid")" || true
            sleep 3
          fi
      - name: Correlate actual HTTP2 logical streams with UE trial time windows
        run: |
          python -m src.phase6_correlate \
            --pcap "$RUNNER_TEMP/phase6.pcap" \
            --trials results/phase6/real_pdu_windows.csv \
            --out results/phase6
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("results/phase6/real_sbi_correlated_summary.json").read_text())
          assert q["phases"]["normal"]["with_nsmf_request"] >= 1
          assert q["phases"]["recovery"]["with_nsmf_request"] >= 1
          assert q["nsmf_streams_attributed"] >= 2
          PY
      - name: Record pinned environment
        if: always()
        run: |
          mkdir -p results/phase6
          python -m pip freeze > results/phase6/python_packages.txt
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/phase6/finished_utc.txt
      - name: Upload only sanitized stream features and procedure windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-real-temporal-nsmf-correlation
          path: results/phase6/
          if-no-files-found: warn
          retention-days: 90
      - name: Erase PCAP and tear down laboratory network
        if: always()
        run: |
          docker rm -f nr_ue nr_gnb || true
          if [ -d upstream_open5gs ]; then
            cd upstream_open5gs
            docker compose -f sa-deploy.yaml down -v || true
          fi
          sudo rm -f "$RUNNER_TEMP/phase6.pcap"
